[default_apps]
teams = "teams-for-linux --enable-features=UseOzonePlatform --ozone-platform=wayland --url {meeting_url}"
calendar_client = "thunderbird"
terminal = "kitty"
browser = "/usr/lib/firefox/firefox %u"

[units]
lengths = "meters"
weights = "kg"
volumes = "l"
temperatures = "C"
currency = "mxm"

[debug]
try_suppress_errors = false
try_suppress_warnings = false
app_paths = []

[appearance]
width = 700
height = 393
gsk_renderer = "cairo"
icon_paths = ["~/.config/sherlock/icons"]
icon_size = 30
use_base_css = true
use_system_theme = false
opacity = 1
mod_key_ascii = ["⇧", "⇧", "⌘", "⌘", "⎇", "✦", "✦", "⌘"]
num_shortcuts = 0

[behavior]
use_xdg_data_dir_icons = false
animate = true
use_lr_nav = false

[binds]
up = "control-k"
down = "control-j"
left = "control-ih"
right = "control-l"
context = "control-i"
modifier = "control"
exec_inplace = "control-return"

[files]
config = "/home/lugo/.config/sherlock/config.toml"
css = "/home/lugo/.config/sherlock/main.css"
fallback = "/home/lugo/.config/sherlock/fallback.json"
alias = "/home/lugo/.config/sherlock/sherlock_alias.json"
ignore = "/home/lugo/.config/sherlock/sherlockignore"
actions = "/home/lugo/.config/sherlock/sherlock_actions.json"

[runtime]
multi = false
center = false
photo_mode = false
display_raw = false
daemonize = false

[caching]
enable = true
cache = "/home/lugo/.cache/sherlock/desktop_files.bin"

[expand]
enable = true
edge = "top"
margin = 200

[backdrop]
enable = true
opacity = 0.5
edge = "top"

[status_bar]
enable = true

[search_bar_icon]
enable = true
icon = "system-search-symbolic"
icon_back = "sherlock-back"
size = 25
