[Settings]
language = en
folder = ~/Pictures/Wallpapers
monitors = All
wallpaper = ~/Pictures/Wallpapers/wallhaven-w5qmjp.jpg
show_path_in_tooltip = True
backend = none
fill = fill
sort = name
color = #ffffff
subfolders = False
all_subfolders = False
show_hidden = False
show_gifs_only = False
zen_mode = False
number_of_columns = 3
swww_transition_type = any
swww_transition_step = 90
swww_transition_angle = 30
swww_transition_duration = 2
swww_transition_fps = 60
mpvpaper_sound = False
mpvpaper_options = 
use_xdg_state = False
post_command = hellwal -i $wallpaper --neon-mode --bright-offset 1 && pkill -USR2 waybar & pywalfox update & swww img --transition-type any --transition-angle 200 --transition-step 100 --transition-duration 1.3 --transition-fps 120 $wallpaper
stylesheet = /home/lugo/.config/waypaper/style.css

